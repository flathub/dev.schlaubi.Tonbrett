app-id: dev.schlaubi.Tonbrett
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: Tonbrett
finish-args:
  - --share=network # required for auth server and to contact API
  - --persist=Tonbrett # persist logs and authentication token
  # required for AWT
  - --share=ipc
  - --device=dri
  - --socket=x11
modules:
  - name: Tonbrett
    only-arches: [x86_64, aarch64]
    buildsystem: simple
    build-commands:
      - install -Dm 644 -t /app/share/applications dev.schlaubi.Tonbrett.desktop
      - install -Dm 644 logo.png /app/share/icons/hicolor/128x128/apps/dev.schlaubi.Tonbrett.png
      - install -Dm 644 -t /app/share/metainfo dev.schlaubi.Tonbrett.metainfo.xml
      - mkdir /app/lib
      - mv lib/* /app/lib
      - install -Dm 755 -t /app/bin bin/*
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/DRSchlaubi/tonbrett/releases/download/3.3.3/tonbrett-3.3.3-linux-amd64.tar.gz
        sha256: 785d3497238a78d540cc4e8826706c92d0ecdb7e1f04405b83f325291e5c05c3
        x-checker-data:
          type: json
          url: https://api.github.com/repos/DRSchlaubi/Tonbrett/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="tonbrett-" + $version +"-linux-amd64.tar.gz")
            | .browser_download_url
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/DRSchlaubi/tonbrett/releases/download/3.3.3/tonbrett-3.3.3-linux-aarch64.tar.gz
        sha256: 25f03123ecebfa072d48691b236dd1ca8e1c6c83e823174fa774a5552d7a49fd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/DRSchlaubi/Tonbrett/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name=="tonbrett-" + $version +"-linux-aarch64.tar.gz")
            | .browser_download_url
      - type: file
        path: logo.png
      - type: file
        path: dev.schlaubi.Tonbrett.desktop
      - type: file
        path: dev.schlaubi.Tonbrett.metainfo.xml
